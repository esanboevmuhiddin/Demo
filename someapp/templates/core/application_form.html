{% extends 'base.html' %}
{% block title %}Новая заявка{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Оформление заявки</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="error">{{ field.errors|striptags }}</div>{% endif %}
            </div>
        {% endfor %}
        <button class="btn btn-primary" type="submit">Отправить на согласование</button>
    </form>
</div>
{% endblock %}
