{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Вход</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Логин</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" required>
        </div>
        <button class="btn btn-primary" type="submit">Войти</button>
    </form>
    <p class="link-back">
        <a href="{% url 'register' %}">Еще не зарегистрированы? Регистрация</a>
    </p>
</div>
{% endblock %}
